<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ByteXL Header</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            font-family: Arial, sans-serif;
        }

        #header {
            display: flex;
            justify-content: space-between;
            align-items: center; 
            padding: 15px 60px;
        }

        .bytexl h1 {
            color: #0d8a3d; 
            margin: 0;
            font-size: 28px;
            font-weight: 700;
        }

        .center {
            display: flex;
            gap: 25px; 
        }

        .center p {
            margin: 0;
            font-size: 15px;
            font-weight: 600;
            color: #2b3a4a;
            cursor: pointer;
        }

        .signin {
            background-color: #1d2b36; 
            color: white;
            padding: 8px 18px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        
        #down {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 22px;              
            padding: 12px 20px;
            border-top: 1px solid #ececec; 
        }

        .down {
            margin: 0;
            font-size: 13px;
            font-weight: 600;
            color: #2b3a4a;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="header">
        <div class="bytexl"> 
            <h1>ByteXL</h1>
        </div>

        <div class="center">
            <p>Courses</p>
            <p>Tutorials</p>
            <p>Practice</p>
            <p>Jobs</p>
        </div>
        
        <div class="signin">
            Sign In
        </div>
    </div>

    <div id="down">
        <p class="down">DSA</p>
        <p class="down">Practice Problems</p>
        <p class="down">C</p>
        <p class="down">C++</p>
        <p class="down">Java</p>
        <p class="down">Python</p>
        <p class="down">JavaScript</p>
        <p class="down">Data Science</p>
        <p class="down">Machine Learning</p>
        <p class="down">Courses</p>
        <p class="down">Linux</p>
        <p class="down">DevOps</p>
    </div>

</body>
</html>
